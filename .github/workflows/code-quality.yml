name: Code Quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Avoid the interactive bootstrap and native builds for static checks.
      YARN_IGNORE_PATH: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Lint / Static Analysis
            command: lint
          - check: Type Check
            command: typecheck
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn --cwd example install --frozen-lockfile --ignore-scripts
      - run: yarn ${{ matrix.command }}
